<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>維也納樂章 RPG — 療癒系音樂冒險</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Georgia","Noto Serif TC",serif;
    background:#3f3225; color:#4a3728; min-height:100vh;
  }
  .wrap { max-width:980px; margin:0 auto; padding:10px; }

  header {
    background:linear-gradient(135deg,#7a5230,#9c7148);
    color:#fdf6e8; border-radius:12px; padding:10px 14px;
    box-shadow:0 4px 12px rgba(0,0,0,.3); margin-bottom:10px;
  }
  header h1 { font-size:1.1rem; letter-spacing:2px; display:inline-block; }
  header .sub { font-size:.72rem; opacity:.85; }
  .stats { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .stat {
    background:rgba(255,250,240,.15); border:1px solid rgba(255,250,240,.3);
    border-radius:20px; padding:3px 10px; font-size:.78rem; white-space:nowrap;
  }
  .energybar { height:6px; background:rgba(0,0,0,.25); border-radius:3px; overflow:hidden; margin-top:6px; }
  .energybar>div { height:100%; background:linear-gradient(90deg,#ffd97a,#ff9d5c); transition:width .4s; }

  .quest {
    background:#fdf3dd; border-left:4px solid #c98f3d; border-radius:8px;
    padding:8px 12px; font-size:.8rem; margin-bottom:10px;
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
  }
  .quest b { color:#a06a1f; }
  .pages { letter-spacing:3px; }
  .storybtn {
    margin-left:auto; font-family:inherit; font-size:.74rem;
    background:#efeaf9; color:#6a5a98; border:1.5px solid #b8a8d8;
    border-radius:20px; padding:4px 12px; cursor:pointer; white-space:nowrap;
  }
  .storybtn:hover { background:#e2d8f5; }

  .gamebox { position:relative; border-radius:12px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.4); }
  canvas { display:block; width:100%; height:auto; touch-action:none; cursor:pointer; background:#87a96b; }
  .hint {
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    background:rgba(50,35,20,.75); color:#ffe9c4; font-size:.75rem;
    padding:5px 14px; border-radius:20px; pointer-events:none; white-space:nowrap;
  }

  .log {
    margin-top:10px; background:#f5ecd9; border-radius:12px; padding:10px 12px;
    max-height:130px; overflow-y:auto; font-size:.8rem; line-height:1.7;
    border:1px solid #e0cba0;
  }
  .log p { border-bottom:1px dotted #d9c49a; padding:2px 0; }
  .log p:first-child { color:#7a5230; font-weight:bold; }
  .muse {
    font-size:.76rem; color:#7a6ba8; background:#efeaf9; border-radius:10px;
    padding:7px 10px; margin-top:8px;
  }
  .sparkle { animation:tw 1.6s infinite; display:inline-block; }
  @keyframes tw { 0%,100%{opacity:1} 50%{opacity:.4} }

  .overlay {
    position:fixed; inset:0; background:rgba(60,40,20,.55);
    display:none; align-items:center; justify-content:center; padding:14px; z-index:50;
  }
  .overlay.show { display:flex; }
  .modal {
    background:#fffaf0; border-radius:16px; max-width:520px; width:100%;
    padding:20px; box-shadow:0 10px 40px rgba(0,0,0,.35);
    max-height:85vh; overflow-y:auto;
  }
  .modal h3 { color:#6d4c2b; margin-bottom:4px; }
  .modal .role { font-size:.75rem; color:#a28a68; margin-bottom:10px; }
  .bubble {
    background:#f5ecd9; border-radius:12px; padding:10px 12px;
    font-size:.88rem; line-height:1.75; margin-bottom:10px; white-space:pre-wrap;
  }
  .bubble.me { background:#e8ddf5; text-align:right; }
  .bubble.good { background:#e2f0d9; }
  .bubble.bad { background:#f5ddd9; }
  .staffbox {
    background:#fffdf6; border:1.5px solid #d9bf94; border-radius:12px;
    padding:6px 10px; margin-bottom:10px; text-align:center;
  }
  .staffbox svg { width:100%; max-width:260px; height:auto; }
  .listenbox {
    background:#2c2244; border-radius:12px; padding:14px; margin-bottom:10px;
    text-align:center; color:#ffe9c4;
  }
  .listenbox .disc { font-size:2rem; display:inline-block; }
  .listenbox .disc.playing { animation:spinS 3s linear infinite; }
  .timebar { height:8px; background:rgba(255,255,255,.15); border-radius:4px; overflow:hidden; margin-top:10px; }
  .timebar>div { height:100%; background:linear-gradient(90deg,#ffd97a,#ff9d5c); width:0%; transition:width .2s linear; }
  .timetxt { font-size:.78rem; margin-top:6px; letter-spacing:1px; }
  .choices { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  button {
    font-family:inherit; background:linear-gradient(135deg,#a97c50,#8a5f36);
    color:#fdf6e8; border:none; border-radius:10px; padding:9px 14px;
    font-size:.86rem; cursor:pointer; transition:filter .15s;
  }
  button:hover { filter:brightness(1.12); }
  button.ghost { background:transparent; color:#8a5f36; border:1.5px solid #b98d5e; }
  .choices button { text-align:left; background:#fdf3dd; color:#5c4326; border:1.5px solid #d9bf94; }
  .choices button:hover { background:#f7e6c3; }
  .chatrow { display:flex; gap:8px; margin-top:10px; }
  .chatrow input {
    flex:1; font-family:inherit; padding:9px 12px; border-radius:10px;
    border:1.5px solid #d9bf94; background:#fffdf8; font-size:.86rem;
  }
  footer { text-align:center; font-size:.7rem; color:#b09b7d; margin:12px 0 6px; }

  /* ══ 開場故事 ══ */
  #intro {
    position:fixed; inset:0; z-index:100;
    background:radial-gradient(ellipse at center,#4a3a55 0%,#241a2e 70%);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .story {
    max-width:560px; width:100%; background:rgba(255,250,240,.97);
    border-radius:18px; padding:22px 26px 24px; box-shadow:0 12px 50px rgba(0,0,0,.5);
    text-align:center; animation:fadeIn .6s;
    max-height:92vh; overflow-y:auto; position:relative;
  }
  @keyframes fadeIn { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
  .scene-art {
    width:100%; border-radius:12px; overflow:hidden; margin-bottom:14px;
    box-shadow:0 4px 14px rgba(60,40,20,.25); line-height:0;
    animation:fadeIn .8s;
  }
  .scene-art svg { width:100%; height:auto; display:block; }
  .story h2 { color:#6d4c2b; font-size:1.15rem; letter-spacing:2px; margin-bottom:12px; }
  .story p {
    font-size:.9rem; line-height:1.9; color:#5c4a35; text-align:left;
    white-space:pre-wrap; margin-bottom:14px;
  }
  .story input {
    width:100%; max-width:280px; font-family:inherit; font-size:1rem;
    padding:10px 14px; border-radius:10px; border:2px solid #c9a06a;
    background:#fffdf8; text-align:center; margin-bottom:14px;
  }
  .story .dots { font-size:.8rem; color:#b09b7d; letter-spacing:6px; margin-top:12px; }
  .skipbtn {
    position:absolute; top:10px; right:12px; font-size:.72rem;
    background:transparent; color:#a28a68; border:1.5px solid #d0bc98;
    border-radius:16px; padding:3px 12px;
  }
  .skipbtn:hover { background:#f5ecd9; }

  /* ══ 歡迎彈窗 ══ */
  #welcome {
    position:fixed; inset:0; z-index:90;
    background:rgba(30,20,45,.7);
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  #welcome.show { display:flex; }
  .welcome-card {
    max-width:460px; width:100%; background:#fffaf0;
    border-radius:18px; padding:24px 26px; text-align:center;
    box-shadow:0 12px 50px rgba(0,0,0,.5);
    border:3px solid #c9a06a;
    animation:popIn .5s cubic-bezier(.2,1.4,.4,1);

  @keyframes popIn { from{opacity:0; transform:scale(.8)} to{opacity:1; transform:scale(1)} }
  .welcome-card .wicon { font-size:2.4rem; margin-bottom:6px; animation:floatY 2.4s ease-in-out infinite; display:inline-block; }
  .welcome-card h2 { color:#6d4c2b; font-size:1.2rem; letter-spacing:2px; margin-bottom:12px; }
  .welcome-card p {
    font-size:.92rem; line-height:2; color:#5c4a35; text-align:left;
    white-space:pre-wrap; margin-bottom:16px;
    background:#f5ecd9; border-radius:12px; padding:12px 14px;
  }

  .glow { animation:glowP 2s ease-in-out infinite; }
  @keyframes spinS { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .spin  { animation:spinS 9s linear infinite; transform-origin:center; transform-box:fill-box; }
  .spinR { animation:spinS 14s linear infinite reverse; transform-origin:center; transform-box:fill-box; }
  @keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  .floaty  { animation:floatY 2.6s ease-in-out infinite; }
  .floaty2 { animation:floatY 3.4s ease-in-out infinite .6s; }
  .floaty3 { animation:floatY 2.1s ease-in-out infinite 1.1s; }
  @keyframes flick { 0%,100%{opacity:1; transform:scaleY(1)} 50%{opacity:.75; transform:scaleY(.85)} }
  .flame { animation:flick .7s ease-in-out infinite; transform-origin:bottom; transform-box:fill-box; }

  .star1 { animation:twk 1.5s infinite; } .star2 { animation:twk 2.2s infinite .5s; } .star3 { animation:twk 1.8s infinite 1s; }
  @keyframes paperF { 0%{transform:translate(0,0) rotate(0)} 25%{transform:translate(8px,-10px) rotate(15deg)} 50%{transform:translate(-4px,-16px) rotate(-10deg)} 75%{transform:translate(10px,-8px) rotate(12deg)} 100%{transform:translate(0,0) rotate(0)} }
  .paper { animation:paperF 4s ease-in-out infinite; transform-box:fill-box; }
  .paper2 { animation:paperF 5s ease-in-out infinite 1.2s; transform-box:fill-box; }
</style>
</head>

/* ══════════ 開場故事 ══════════ */
const STORY=[
  {art:"lib", title:"香城大學 · 音樂系", text:
"你是香城大學音樂系三年級的學生,期末報告的題目正是——莫札特《費加洛的婚禮》。\n\n深夜的圖書館古籍區,你在一個佈滿灰塵的木盒裡,發現一頁泛黃的樂譜殘稿,墨跡竟像是親筆手書……"},
  {art:"warp", title:"穿越", text:
"指尖觸到樂譜的瞬間,紙上的音符突然發出金光,在空中旋轉成漩渦!\n\n耳邊響起序曲般奔湧的旋律,你眼前一黑——\n\n再睜開眼,你躺在鵝卵石街道上。馬車轆轆、教堂鐘聲、遠處傳來大鍵琴的聲音……這裡是 1786 年的維也納!"},
  {art:"street", title:"急匆匆的紅衣男子", text:
"「讓一讓!讓一讓——哎呀!」\n\n一位穿紅色外套、戴白色假髮的男子撞上了你,滿地散落的譜紙隨風飛舞。\n\n「抱歉抱歉!我在找我的手稿——《費加洛的婚禮》的樂譜散落在城裡各處了!首演就快到了,完蛋了完蛋了……」\n\n你倒抽一口氣。眼前這位,正是課本裡的那個人——沃夫岡·阿瑪迪斯·莫札特!"},
  {art:"muse", title:"小繆思的耳語", text:
"一顆小小的光點飄到你肩上,是音樂繆思的化身。\n\n「旅人呀,把散落的 5 頁手稿找回來,幫助《費加洛的婚禮》順利首演——那頁把你帶來的樂譜,也許就是你回到現代的鑰匙。」\n\n冒險開始之前,請告訴維也納——你的名字。", input:true}
];
let storyIdx=0;
function renderStory(){
  const st=STORY[storyIdx], box=document.getElementById("storyBox");
  box.innerHTML="";
  if(gameStarted){
    const skip=document.createElement("button");skip.className="skipbtn";skip.textContent="✕ 返回遊戲";
    skip.onclick=closeIntro;box.appendChild(skip);
  }
  const art=document.createElement("div");art.className="scene-art";art.innerHTML=ART[st.art];box.appendChild(art);
  const h=document.createElement("h2");h.textContent=st.title;box.appendChild(h);
  const p=document.createElement("p");p.textContent=st.text;box.appendChild(p);
  if(st.input){
    if(gameStarted){
      const done=document.createElement("p");done.style.textAlign="center";done.style.color="#8a7358";
      done.textContent="——你的名字是 "+S.name+",冒險仍在繼續。——";
      box.appendChild(done);
      const btn=document.createElement("button");btn.textContent="↩ 返回遊戲";
      btn.onclick=closeIntro;box.appendChild(btn);
      const back=document.createElement("button");back.textContent="◀";back.className="ghost";back.style.marginLeft="8px";
      back.onclick=()=>{storyIdx--;renderStory();};box.appendChild(back);
    }else{
      const inp=document.createElement("input");inp.id="nameInput";inp.placeholder="輸入你的名字…";inp.maxLength=12;
      box.appendChild(inp);box.appendChild(document.createElement("br"));
      const btn=document.createElement("button");btn.textContent="🎼 踏入 1786 年的維也納";
      btn.onclick=()=>{
        const v=inp.value.trim()||"小音樂家";
        S.name=v;document.getElementById("pname").textContent=v;
        gameStarted=true;
        closeIntro();
        showWelcome(v);
      };
      inp.addEventListener("keydown",e=>{if(e.key==="Enter")btn.click();});
      box.appendChild(btn);
      setTimeout(()=>inp.focus(),100);
    }
  }else{
    const btn=document.createElement("button");btn.textContent="下一頁 ▶";
    btn.onclick=()=>{storyIdx++;renderStory();};
    box.appendChild(btn);
    if(storyIdx>0){
      const back=document.createElement("button");back.textContent="◀";back.className="ghost";back.style.marginLeft="8px";
      back.onclick=()=>{storyIdx--;renderStory();};
      box.appendChild(back);
    }
  }
  const dots=document.createElement("div");dots.className="dots";
  dots.textContent=STORY.map((_,i)=>i===storyIdx?"●":"○").join(" ");
  box.appendChild(dots);
}
function closeIntro(){document.getElementById("intro").style.display="none";}
function openIntro(){
  storyIdx=0;
  document.getElementById("intro").style.display="flex";
  renderStory();
}
document.getElementById("storyBtn").addEventListener("click",()=>{
  if(!gameStarted)return;
  openIntro();
});
renderStory();

/* ══════════ 歡迎彈窗 ══════════ */
function showWelcome(name){
  document.getElementById("welcomeText").innerHTML=
    "你好,<span class='hl'>"+name.replace(/</g,"&lt;").replace(/>/g,"&gt;")+"</span>,你已經穿越到<span class='hl'>古典時期</span>!\n\n"+
    "現在需要你集齊 <span class='hl'>5 項樂譜手稿</span>,才能回到你的住處。\n\n"+
    "📜 第一頁手稿就在 <span class='hl'>☕ 中央咖啡館</span>——\n\n快去尋找失落的樂譜手稿吧!";
  document.getElementById("welcome").classList.add("show");
}
document.getElementById("welcomeBtn").addEventListener("click",()=>{
  document.getElementById("welcome").classList.remove("show");
  log("🌅 "+S.name+",你的維也納冒險開始了!第一頁手稿在 ☕ 中央咖啡館,快去尋找吧!");
  muse(S.name+",答對咖啡館 8 題古典樂識,老闆就會交出第一頁手稿喔!");
  refresh();
});

  {q:"與巴洛克的「階梯式力度」不同,古典時期常用的力度手法是?",opts:["全曲維持同一音量","漸強、漸弱(crescendo / diminuendo)","只用最強音演奏"],ans:1,tip:"古典時期樂團(如曼海姆樂派)發展出漸強漸弱的細膩力度變化,讓音樂像呼吸一樣有起伏。"},
  {q:"古典時期音樂的整體風格特徵是?",opts:["莊嚴繁複、裝飾華麗","簡潔清晰、對稱平衡、優雅工整","朦朧飄渺、色彩至上"],ans:1,tip:"古典風格追求如建築般的對稱與平衡:旋律簡潔如歌、結構清晰工整。"},
  {q:"巴洛克時期盛行的「數字低音」到了古典時期?",opts:["更加盛行","逐漸式微、被寫定的伴奏聲部取代","變成獨奏樂器"],ans:1,tip:"古典時期作曲家把伴奏完整寫出來,不再靠數字低音即興,和聲進行也更清晰規範。"},

/* ══════════════════════════════════════
   🎧 音樂合成引擎(Web Audio)
══════════════════════════════════════ */
let audioCtx=null, masterGain=null, playTimer=null;
function noteFreq(n){
  const m=n.match(/^([A-G])(#?)(\d)$/);
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);
  const midi=(parseInt(m[3])+1)*12+base;
  return 440*Math.pow(2,(midi-69)/12);
}
function scheduleNote(names,t,dur,vel){
  (Array.isArray(names)?names:[names]).forEach(nm=>{
    const o=audioCtx.createOscillator();o.type="triangle";
    o.frequency.value=noteFreq(nm);
    const g=audioCtx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vel,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+Math.max(dur*0.95,0.08)+0.05);
    o.connect(g);g.connect(masterGain);
    o.start(t);o.stop(t+dur+0.15);
  });
}
function startMusic(melody,unit,totalSec,onTick,onEnd){
  stopMusic();
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  masterGain=audioCtx.createGain();masterGain.gain.value=1;
  masterGain.connect(audioCtx.destination);
  let t=audioCtx.currentTime+0.15;
  const start=audioCtx.currentTime, endT=start+totalSec;
  while(t<endT){
    for(const nt of melody){
      if(t>=endT)break;
      const dur=nt.d*unit;
      if(nt.n!=="R"){
        scheduleNote(nt.n,t,dur,nt.v!==undefined?nt.v:0.16);
        if(nt.acc)scheduleNote(nt.acc,t,dur,(nt.v!==undefined?nt.v:0.16)*0.45);
      }
      t+=dur;
    }
    t+=unit*2;
  }
  playTimer=setInterval(()=>{
    if(!audioCtx){clearInterval(playTimer);playTimer=null;return;}
    const el=audioCtx.currentTime-start;
    const remain=Math.max(0,totalSec-el);
    if(onTick)onTick(el/totalSec,remain);
    if(el>=totalSec){
      clearInterval(playTimer);playTimer=null;
      stopMusic();
      if(onEnd)onEnd();
    }
  },200);
}
function stopMusic(){
  if(playTimer){clearInterval(playTimer);playTimer=null;}
  if(audioCtx){
    const c=audioCtx;audioCtx=null;
    try{masterGain.gain.linearRampToValueAtTime(0.0001,c.currentTime+0.2);}catch(e){}
    setTimeout(()=>{try{c.close();}catch(e){}},350);
    masterGain=null;
  }
}

const PERF_NOTES=[
  {l:"C",y:70,ledger:[70],d:"下加一線"},
  {l:"D",y:65,d:"下加一線與第一線之間"},
  {l:"E",y:60,d:"第一線"},

  {l:"G",y:50,d:"第二線(高音譜號纏繞的那條線!)"},

  {l:"D",y:30,d:"第四線"},
  {l:"E",y:25,d:"第四間"},
  {l:"F",y:20,d:"第五線"},
  {l:"G",y:15,d:"第五線之上的空間"},
  {l:"A",y:10,ledger:[10],d:"上加一線"}
];
const SOLF={C:"Do",D:"Re",E:"Mi",F:"Fa",G:"Sol",A:"La",B:"Si"};
const LETTERS=["C","D","E","F","G","A","B"];

function noteSVG(note){
  const y=note.y;
  let s='<svg viewBox="0 0 200 92" xmlns="http://www.w3.org/2000/svg">';
  for(let ly=20;ly<=60;ly+=10)
    s+='<line x1="26" y1="'+ly+'" x2="184" y2="'+ly+'" stroke="#6d4c2b" stroke-width="1.6"/>';
  s+='<text x="30" y="66" font-size="58" fill="#5c4326" font-family="serif">&#119070;</text>';
  (note.ledger||[]).forEach(ly=>{
    s+='<line x1="106" y1="'+ly+'" x2="134" y2="'+ly+'" stroke="#6d4c2b" stroke-width="1.6"/>';
  });
  s+='<ellipse cx="120" cy="'+y+'" rx="7.5" ry="5.4" fill="#3d2c18" transform="rotate(-14 120 '+y+')"/>';
  if(y>=40) s+='<line x1="127" y1="'+y+'" x2="127" y2="'+(y-30)+'" stroke="#3d2c18" stroke-width="2"/>';
  else      s+='<line x1="113" y1="'+y+'" x2="113" y2="'+(y+30)+'" stroke="#3d2c18" stroke-width="2"/>';
  s+='</svg>';
  return s;
}

          openModal("📜 第一條線索!","☕ 中央咖啡館",bb=>{
            const d=document.createElement("div");d.className="bubble";
            d.textContent="咖啡館老闆聽完你的回答,忍不住鼓掌:\n\n「年輕人,你對古典音樂的了解真不簡單!對了……前幾天有位客人,竟拿一頁樂譜來墊咖啡杯,我看著心疼就收了起來——你瞧瞧,是不是莫札特先生在找的?」\n\n他從櫃檯下取出一頁染著咖啡漬的譜紙——正是《費加洛的婚禮》手稿!\n\n🎼 獲得手稿第 1 頁!(聲望 +1)\n\n老闆補充:「這是第一頁樂譜手稿,聽說其餘幾頁,散落在莫札特宅邸、海頓府第、樂譜店和貴族沙龍。這就是你的下一步線索了!\n\n(提示:聲望達 10,才可以進入海頓府第拿第二條線索。去 🏠 工作室辦公開演奏,就能累積聲望!)」";
            bb.appendChild(d);
            const ok=document.createElement("button");ok.textContent="🎉 太好了!繼續尋找其他手稿";
            ok.onclick=closeModal;bb.appendChild(ok);
          });
          log("🎼 獲得《費加洛婚禮》手稿第 1 頁!其餘散落在:🎩 莫札特宅邸、🎻 海頓府第(需聲望 10)、🎶 樂譜店、🕯️ 貴族沙龍。");
          muse("第一條線索到手!先去 🏠 工作室公開演奏,把聲望練到 10,才能進入海頓府第喔!");
          return;
        }
        if(!S.pages[0]) muse("好厲害!再答對 "+(8-S.cafeCorrect)+" 題,老闆就會告訴你手稿的線索!");
        else muse(Q.tip);
      }else{
        fb.classList.add("bad");
        fb.textContent="❌ 答錯了……\n\n正確答案:"+Q.opts[Q.ans]+"\n\n💡 "+Q.tip;
        log("❌ 咖啡館答錯……正確答案:"+Q.opts[Q.ans]);
        muse("別氣餒!"+Q.tip);
      }
      body.appendChild(fb);
      const row=document.createElement("div");row.className="choices";
      const next=document.createElement("button");
      next.textContent=S.energy>=5?"➡️ 下一題(-5 體力)":"😪 體力不足,無法再答題";
      next.onclick=()=>nextCafeQ(body);
      row.appendChild(next);
      const leave=document.createElement("button");leave.textContent="↩ 喝口咖啡,先休息(離開)";
      leave.onclick=closeModal;row.appendChild(leave);
      body.appendChild(row);
    };
    c.appendChild(btn);
  });
  body.appendChild(c);
  const more=document.createElement("div");more.style.cssText="font-size:.72rem;color:#a28a68;margin-top:10px;";
  more.textContent="💡 每題進場即扣 5 體力,答錯不退還;答對過的題目不重複計分,答錯可再挑戰。";
  body.appendChild(more);
  const leave=document.createElement("button");leave.textContent="↩ 離開";leave.className="ghost";leave.style.marginTop="10px";
  leave.onclick=closeModal;body.appendChild(leave);
}

/* ══════════ 一般問答 ══════════ */
function pickQuiz(keys){
  const fresh=keys.filter(k=>!S.quizDone[k]);
  const pool=fresh.length?fresh:keys;
  return pool[Math.floor(Math.random()*pool.length)];
}
function quiz(keys,goldR,repR,cost){
  if(!useEnergy(cost||10))return;
  const k=pickQuiz(keys);const QQ=QUIZ[k];
  openModal("🎵 音樂問答","答對可獲得克朗、聲望與樂識!",b=>{
    const q=document.createElement("div");q.className="bubble";q.textContent=QQ.q;b.appendChild(q);
    const c=document.createElement("div");c.className="choices";
    QQ.opts.forEach((o,i)=>{
      const btn=document.createElement("button");btn.textContent=String.fromCharCode(65+i)+". "+o;
      btn.onclick=()=>{
        if(i===QQ.ans){
          S.quizDone[k]=true;S.gold+=goldR;S.rep+=repR;S.know+=1;
          log("✅ 答對!"+QQ.tip+"(克朗 +"+goldR+"、聲望 +"+repR+"、樂識 +1)");
          muse("答對了!"+QQ.tip);
        }else{
          log("❌ 答錯了……正確答案:"+QQ.opts[QQ.ans]);
          muse("別氣餒!提示:"+QQ.tip);
        }
        closeModal();tick();
      };
      c.appendChild(btn);
    });
    b.appendChild(c);
  });
}

/* ══════════ 樂譜頁任務(通用) ══════════ */
function pageQuest(idx,quizKey,intro){
  if(S.pages[idx]){log("📜 這一頁你已經找回了。");closeModal();return;}
  if(!S.pages[0]){
    log("🤔 對方似乎不信任陌生人……先去 ☕ 中央咖啡館答題,取得第一條線索吧!");
    muse("先在咖啡館答對 8 題、拿到第一條線索,大家才會信任你喔!");
    closeModal();return;
  }
  if(!useEnergy(10))return;
  const Q=QUIZ[quizKey];
  openModal("📜 失落的手稿 · 第 "+(idx+1)+" 頁","主線任務",b=>{
    const s=document.createElement("div");s.className="bubble";s.textContent=intro;b.appendChild(s);
    const q=document.createElement("div");q.className="bubble";q.textContent="❓ "+Q.q;b.appendChild(q);
    const c=document.createElement("div");c.className="choices";
    Q.opts.forEach((o,i)=>{
      const btn=document.createElement("button");btn.textContent=String.fromCharCode(65+i)+". "+o;
      btn.onclick=()=>{
        if(i===Q.ans){
          S.pages[idx]=true;S.know+=2;S.rep+=1;
          log("🎼 找回《費加洛婚禮》手稿第 "+(idx+1)+" 頁!("+Q.tip+")");
          muse(S.pages.every(p=>p)?"五頁都齊了!快去 🏛️ 城堡劇院參加首演!!":"還差 "+S.pages.filter(p=>!p).length+" 頁,加油!");
        }else{
          log("❌ 答錯了,對方把樂譜收了回去……(提示:"+Q.tip+")");
          muse("提示:"+Q.tip+" 記住之後再來一次!");
        }
        closeModal();tick();
      };
      c.appendChild(btn);
    });
    b.appendChild(c);
  });
}

/* ══════════ AI 對話 ══════════ */
function chat(id){
  const N=NPC[id];
  openModal("💬 "+N.name,N.role,b=>{
    const box=document.createElement("div");
    const first=document.createElement("div");first.className="bubble";
    first.textContent=typeof N.hello==="function"?N.hello():N.hello;
    box.appendChild(first);b.appendChild(box);
    const row=document.createElement("div");row.className="chatrow";
    const inp=document.createElement("input");inp.placeholder="輸入話題……(如:歌劇、交響曲、快樂頌)";
    const send=document.createElement("button");send.textContent="送出";
    const reply=()=>{
      const t=inp.value.trim();if(!t)return;
      const me=document.createElement("div");me.className="bubble me";me.textContent=t;box.appendChild(me);
      let ans=N.fallback;
      for(const [re,r] of N.rules){if(re.test(t)){ans=r;break;}}
      const bb=document.createElement("div");bb.className="bubble";bb.textContent=ans;box.appendChild(bb);
      inp.value="";bb.scrollIntoView({behavior:"smooth"});
    };
    send.onclick=reply;inp.addEventListener("keydown",e=>{if(e.key==="Enter")reply();});
    row.appendChild(inp);row.appendChild(send);b.appendChild(row);
    const close=document.createElement("button");close.textContent="↩ 結束交談";close.className="ghost";close.style.marginTop="10px";
    close.onclick=closeModal;b.appendChild(close);
  });
}

/* ══════════ 結局 ══════════ */
function finale(){
  if(S.ended){log("🎭 首演已圓滿落幕,你可以繼續自由探索。");closeModal();return;}
  S.ended=true;S.rep+=5;S.gold+=50;
  openModal("🎉 《費加洛婚禮》首演之夜","1786 年 5 月 1 日 · 城堡劇院",b=>{
    const d=document.createElement("div");d.className="bubble";
    d.textContent="幕啟。序曲如香檳般奔湧而出,你找回的五頁手稿在譜架上閃閃發光。\n\n莫札特在指揮席上回頭,對你眨了眨眼:「"+S.name+",謝謝你——無論你來自哪裡。」\n\n終場掌聲如雷。海頓爸爸拍拍你的肩:「孩子,維也納會記住今晚——也會記住你。」\n\n那頁把你帶來的樂譜,在你懷中微微發光……回家的路,似乎已經打開。\n\n🏆 冒險成果\n🎓 冒險者:"+S.name+"\n📅 用時:"+S.day+" 天\n📖 樂識:"+S.know+"\n⭐ 聲望:"+S.rep+"\n💰 克朗:"+S.gold+"\n\n🎼 恭喜通關!";
    b.appendChild(d);
    const btn=document.createElement("button");btn.textContent="🌟 繼續我的維也納生活";btn.onclick=closeModal;
    b.appendChild(btn);
  });
  log("🏆 《費加洛婚禮》首演大成功!(聲望 +5、克朗 +50)");
}

/* ══════════════════════════════════════
   RPG 地圖引擎:按住滑鼠走路
══════════════════════════════════════ */
const cv=$("game"),ctx=cv.getContext("2d");
const player={x:180,y:230,dir:1,walking:false};
const SPEED=2.6;
let held=false,target={x:player.x,y:player.y},zoneLock=null,t0=0;

function setTarget(e){
  const r=cv.getBoundingClientRect();
  target.x=(e.clientX-r.left)*(cv.width/r.width);
  target.y=(e.clientY-r.top)*(cv.height/r.height);
}
cv.addEventListener("pointerdown",e=>{held=true;setTarget(e);cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{if(held)setTarget(e);});
cv.addEventListener("pointerup",()=>held=false);
cv.addEventListener("pointercancel",()=>held=false);

function solid(px,py){
  if(px<14||px>cv.width-14||py<14||py>cv.height-8)return true;
  for(const b of BUILDINGS){
    if(px>b.x-10&&px<b.x+b.w+10&&py>b.y-6&&py<b.y+b.h-4)return true;
  }
  const dx=px-480,dy=py-330;
  if(dx*dx+dy*dy<48*48)return true;
  return false;
}

function update(){
  player.walking=false;
  const introOn=document.getElementById("intro").style.display!=="none";
  const welcomeOn=document.getElementById("welcome").classList.contains("show");
  if(held&&!$("overlay").classList.contains("show")&&!introOn&&!welcomeOn){
    const dx=target.x-player.x,dy=target.y-player.y;
    const d=Math.hypot(dx,dy);
    if(d>6){
      const nx=player.x+dx/d*SPEED,ny=player.y+dy/d*SPEED;
      if(!solid(nx,player.y))player.x=nx;
      if(!solid(player.x,ny))player.y=ny;
      player.dir=dx<0?-1:1;
      player.walking=true;
    }
  }
  let inZone=null;
  for(const b of BUILDINGS){
    const d=b.door;
    if(player.x>d.x&&player.x<d.x+d.w&&player.y>d.y&&player.y<d.y+d.h){inZone=b;break;}
  }
  if(inZone&&!introOn&&!welcomeOn){
    if(zoneLock!==inZone.id){
      zoneLock=inZone.id;held=false;
      if(inZone.lock&&inZone.lock()){
        log("🔒 "+inZone.name+":"+inZone.lockMsg);
        muse(inZone.id==="haydn"?"海頓府第的門房不認識你……去 🏠 工作室公開演奏,把聲望練到 10(目前 "+S.rep+")!":inZone.lockMsg);
      }else{
        openLoc(inZone);
      }
    }
  }else if(!inZone)zoneLock=null;
}

/* ══════════ 繪圖 ══════════ */
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawMap(){
  ctx.fillStyle="#87a96b";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#cdb896";
  ctx.fillRect(0,215,cv.width,80);
  ctx.fillRect(0,430,cv.width,60);
  ctx.fillRect(280,0,70,cv.height);
  ctx.fillRect(620,0,70,cv.height);
  ctx.fillStyle="#d6c3a1";ctx.beginPath();ctx.arc(480,330,95,0,7);ctx.fill();
  ctx.strokeStyle="rgba(120,100,70,.18)";ctx.lineWidth=1;
  for(let i=0;i<40;i++){const x=(i*137)%960,y=(i*211)%620;
    ctx.strokeRect(x,y,22,10);}
  ctx.fillStyle="#8fb6c9";ctx.beginPath();ctx.arc(480,330,42,0,7);ctx.fill();
  ctx.strokeStyle="#6a8a99";ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle="#c9dde8";ctx.beginPath();ctx.arc(480,330,20,0,7);ctx.fill();
  const bob=Math.sin(t0/300)*3;
  ctx.font="20px serif";ctx.textAlign="center";
  ctx.fillText("⛲",480,320+bob);
  ctx.font="26px serif";
  [[30,420],[240,180],[930,250],[380,600],[900,610],[30,610],[590,40],[240,40]].forEach(p=>ctx.fillText("🌳",p[0],p[1]));

  BUILDINGS.forEach(b=>{
    const locked=b.lock&&b.lock();
    ctx.fillStyle=locked?"#a09a8c":b.wall;
    roundRect(b.x,b.y+22,b.w,b.h-22,6);ctx.fill();
    ctx.strokeStyle="rgba(80,55,30,.4)";ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=locked?"#6d685e":b.roof;
    ctx.beginPath();
    ctx.moveTo(b.x-10,b.y+26);ctx.lineTo(b.x+b.w/2,b.y-8);ctx.lineTo(b.x+b.w+10,b.y+26);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=S.slot>=3?"#ffd97a":"#e8f1f5";
    ctx.fillRect(b.x+16,b.y+44,24,22);ctx.fillRect(b.x+b.w-40,b.y+44,24,22);
    ctx.strokeStyle="rgba(80,55,30,.5)";ctx.lineWidth=1.5;
    ctx.strokeRect(b.x+16,b.y+44,24,22);ctx.strokeRect(b.x+b.w-40,b.y+44,24,22);
    ctx.fillStyle="#5c4326";
    ctx.fillRect(b.x+b.w/2-14,b.y+b.h-34,28,34);
    ctx.fillStyle="#c9a06a";ctx.beginPath();ctx.arc(b.x+b.w/2+8,b.y+b.h-17,2.5,0,7);ctx.fill();
    ctx.fillStyle="rgba(255,220,140,.35)";
    roundRect(b.door.x,b.door.y,b.door.w,b.door.h,8);ctx.fill();
    ctx.font="24px serif";ctx.textAlign="center";
    ctx.fillText(locked?"🔒":b.icon,b.x+b.w/2,b.y+18);
    ctx.font="bold 13px Georgia, 'Noto Serif TC', serif";
    ctx.fillStyle="#3d2c18";
    ctx.fillText(b.name,b.x+b.w/2,b.y+b.h+56);
    const pg=PAGE_AT[b.id];
    if(pg!==undefined&&!S.pages[pg]&&!locked){
      ctx.font="18px serif";
      ctx.fillText("📜",b.x+b.w-18,b.y-14+Math.sin(t0/250+b.x)*4);
    }
    if(b.id==="haydn"&&S.rep<10){
      ctx.font="bold 11px Georgia, 'Noto Serif TC', serif";
      ctx.fillStyle="#7a3b2b";
      ctx.fillText("⭐需聲望10(現"+S.rep+")",b.x+b.w/2,b.y-24);
      ctx.fillStyle="#3d2c18";
    }
    if(b.id==="shop"&&S.pages[0]&&!S.pages[1]&&!S.odeScore){
      ctx.font="bold 11px Georgia, 'Noto Serif TC', serif";
      ctx.fillStyle="#5c4a8a";
      ctx.fillText("🎁《快樂頌》100克朗",b.x+b.w/2,b.y-24);
      ctx.fillStyle="#3d2c18";
    }
    if(b.id==="opera"&&!locked&&!S.ended){
      ctx.font="20px serif";
      ctx.fillText("❗",b.x+b.w/2,b.y-20+Math.sin(t0/200)*5);
    }
  });
}

function drawPlayer(){
  const p=player,w=p.walking;
  const bob=w?Math.sin(t0/80)*2:0;
  const leg=w?Math.sin(t0/80)*5:0;
  ctx.save();
  ctx.translate(p.x,p.y+bob);
  ctx.scale(p.dir,1);
  ctx.fillStyle="rgba(0,0,0,.2)";
  ctx.beginPath();ctx.ellipse(0,14-bob,11,4,0,0,7);ctx.fill();
  ctx.strokeStyle="#4a3222";ctx.lineWidth=4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-3,2);ctx.lineTo(-3+leg,13);ctx.stroke();
  ctx.beginPath();ctx.moveTo(3,2);ctx.lineTo(3-leg,13);ctx.stroke();
  ctx.fillStyle="#7a3b3b";
  roundRect(-9,-14,18,18,5);ctx.fill();
  ctx.fillStyle="#f5efe0";ctx.beginPath();ctx.arc(0,-12,4,0,7);ctx.fill();
  ctx.fillStyle="#f0cfa8";ctx.beginPath();ctx.arc(0,-22,8,0,7);ctx.fill();
  ctx.fillStyle="#efe8dc";
  ctx.beginPath();ctx.arc(-2,-26,7,Math.PI*.9,Math.PI*1.95);ctx.fill();
  ctx.beginPath();ctx.arc(-8,-20,3.5,0,7);ctx.fill();
  ctx.fillStyle="#3d2c18";ctx.beginPath();ctx.arc(3,-23,1.4,0,7);ctx.fill();
  ctx.fillStyle="#fffaf0";ctx.fillRect(4,-10,9,11);
  ctx.strokeStyle="#8a7358";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(5,-7);ctx.lineTo(12,-7);ctx.moveTo(5,-4);ctx.lineTo(12,-4);ctx.moveTo(5,-1);ctx.lineTo(12,-1);ctx.stroke();
  ctx.restore();

  if(S.name){
    ctx.font="bold 11px Georgia, 'Noto Serif TC', serif";
    ctx.fillStyle="rgba(50,35,20,.75)";ctx.textAlign="center";
    ctx.fillText(S.name,p.x,p.y-38);
  }

  if(held){
    ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=2;
    const r=8+Math.sin(t0/120)*3;
    ctx.beginPath();ctx.arc(target.x,target.y,r,0,7);ctx.stroke();
  }
  if(w&&Math.floor(t0/300)%2===0){
    ctx.font="13px serif";ctx.fillStyle="rgba(90,60,120,.5)";
    ctx.fillText("♪",p.x-p.dir*16,p.y-26+Math.sin(t0/150)*4);
  }
}

function drawDayNight(){
  if(S.slot===3){ctx.fillStyle="rgba(255,140,50,.13)";ctx.fillRect(0,0,cv.width,cv.height);}
  else if(S.slot===4){ctx.fillStyle="rgba(20,30,80,.32)";ctx.fillRect(0,0,cv.width,cv.height);
    ctx.font="16px serif";ctx.fillStyle="rgba(255,255,220,.9)";
    ctx.fillText("🌙",920,30);}
  else if(S.slot===0){ctx.fillStyle="rgba(255,200,120,.08)";ctx.fillRect(0,0,cv.width,cv.height);}
}

function loop(t){
  t0=t;update();
  drawMap();drawPlayer();drawDayNight();
  requestAnimationFrame(loop);
}
refresh();
requestAnimationFrame(loop);
</script>
